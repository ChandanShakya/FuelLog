name: Build and Release

on:
  push:
    branches: [main]
    paths-ignore: ['website/**', '**.md', 'LICENSE']
  workflow_dispatch:

env:
  # Modest heap, no parallel workers, Kotlin compiled in-process: keeps the runner container
  # responsive (a starved podman runner times out copying step files after R8).
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.parallel=false -Dkotlin.compiler.execution.strategy=in-process"
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
  ANDROID_HOME: /opt/android-sdk

jobs:
  build-and-test:
    name: Build and Test
    runs-on: codeberg-medium

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install JDK 17 and tools
        run: |
          apt-get update
          apt-get install -y openjdk-17-jdk wget unzip jq

      - name: Install Android SDK
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --console=plain

      - name: Build release APK and bundle
        if: forgejo.ref == 'refs/heads/main' && forgejo.event_name == 'push'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 secret is missing" >&2
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
          # APK only: bundleRelease runs R8 a second time and is what overloads the runner.
          # The AAB for Play Console is attached to the GitHub release.
          ./gradlew assembleRelease --no-daemon --console=plain -q

      - name: Get version info
        if: forgejo.ref == 'refs/heads/main' && forgejo.event_name == 'push'
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | grep -o '"[0-9.]*"' | tr -d '"' | head -1)
          echo "VERSION_NAME=$VERSION_NAME" >> $FORGEJO_OUTPUT

      - name: Find APK and AAB paths
        if: forgejo.ref == 'refs/heads/main' && forgejo.event_name == 'push'
        id: paths
        run: |
          APK_PATH=$(find app/build/outputs -name "*.apk" -path "*/release/*" | head -1)
          if [ -z "$APK_PATH" ]; then echo "Release APK not found" >&2; exit 1; fi
          echo "APK_PATH=$APK_PATH" >> $FORGEJO_OUTPUT

      - name: Create Codeberg Release
        if: forgejo.ref == 'refs/heads/main' && forgejo.event_name == 'push'
        run: |
          VERSION="v${{ steps.version.outputs.VERSION_NAME }}"
          APK="${{ steps.paths.outputs.APK_PATH }}"

          curl -s -X POST \
            -H "Authorization: token ${{ secrets.CODEBERG_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://codeberg.org/api/v1/repos/ChandanShakya/FuelLog/releases" \
            -d "{
              \"tag_name\": \"$VERSION\",
              \"name\": \"FuelLog $VERSION\",
              \"body\": \"FuelLog Android Fuel Tracker $VERSION\",
              \"draft\": false,
              \"prerelease\": false
            }" | jq .

          RELEASE_ID=$(curl -s \
            -H "Authorization: token ${{ secrets.CODEBERG_TOKEN }}" \
            "https://codeberg.org/api/v1/repos/ChandanShakya/FuelLog/releases/tags/$VERSION" | jq '.id')

          curl -s -X POST \
            -H "Authorization: token ${{ secrets.CODEBERG_TOKEN }}" \
            -F "attachment=@$APK" \
            "https://codeberg.org/api/v1/repos/ChandanShakya/FuelLog/releases/$RELEASE_ID/assets"
