name: Build and Release

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'website/**', '**.md', 'LICENSE' ]
  pull_request:
    branches: [ main ]
    paths-ignore: [ 'website/**', '**.md', 'LICENSE' ]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-release:
    name: Build, Test, and Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Uses ./gradlew (8.11.1 from the wrapper); no second Gradle download.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Resolve version and whether to release
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          if [ -z "$VERSION_NAME" ]; then
            echo "Could not read versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          RELEASE=false
          # Release builds only on main, and only for a version that has no release yet
          # (bump versionName to ship). Manual runs can re-publish.
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || ! gh release view "v$VERSION_NAME" >/dev/null 2>&1; then
              RELEASE=true
            fi
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "RELEASE=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION_NAME, release=$RELEASE"

      - name: Decode keystore
        if: steps.version.outputs.RELEASE == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 secret is missing" >&2
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore

      # One Gradle invocation: shared configuration, tests and release build run in parallel.
      - name: Test (and build release APK + AAB when releasing)
        run: |
          TASKS="testDebugUnitTest"
          if [ "${{ steps.version.outputs.RELEASE }}" = "true" ]; then
            TASKS="$TASKS assembleRelease bundleRelease"
          fi
          ./gradlew $TASKS --stacktrace

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/

      - name: Publish GitHub Release
        if: steps.version.outputs.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.VERSION_NAME }}
        run: |
          APK=$(find app/build/outputs -name "app-release.apk" | head -1)
          AAB=$(find app/build/outputs -name "*.aab" -path "*/release/*" | head -1)
          if [ -z "$APK" ] || [ -z "$AAB" ]; then
            echo "Release APK/AAB not found" >&2
            find app/build/outputs -type f >&2
            exit 1
          fi
          ls -l "$APK" "$AAB"
          # gh creates the git tag at this commit and publishes (never a draft).
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$AAB" --clobber
            gh release edit "$TAG" --draft=false --latest
          else
            gh release create "$TAG" "$APK" "$AAB" \
              --target "$GITHUB_SHA" \
              --title "FuelLog $TAG" \
              --generate-notes --latest \
              --notes "Download \`app-release.apk\` to install (Android 8.0+, minSdk 26). \`app-release.aab\` is for Play Console."
          fi
