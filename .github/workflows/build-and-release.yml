name: Build and Release

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'website/**', '**.md', 'LICENSE' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

permissions:
  contents: write

jobs:
  build-test-release:
    name: Build, Test, and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK and run tests
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Decode keystore
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 secret is missing" >&2
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
          ls -la release.keystore

      - name: Build release APK and bundle
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Get version info
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: version
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          if [ -z "$VERSION_NAME" ]; then
            echo "Could not read versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION_NAME (code $VERSION_CODE)"

      - name: Locate release artifacts
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: paths
        run: |
          APK_PATH=$(find app/build/outputs \( -name "*-release.apk" -o -name "app-release.apk" \) | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs -name "*.apk" -path "*/release/*" | head -1)
          fi
          AAB_PATH=$(find app/build/outputs -name "*.aab" -path "*/release/*" | head -1)

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Release APK not found under app/build/outputs" >&2
            find app/build/outputs -type f | head -100 >&2 || true
            exit 1
          fi
          if [ -z "$AAB_PATH" ] || [ ! -f "$AAB_PATH" ]; then
            echo "Release AAB not found under app/build/outputs" >&2
            exit 1
          fi

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "AAB_PATH=$AAB_PATH" >> "$GITHUB_OUTPUT"
          echo "Will publish:"
          echo "  $APK_PATH"
          echo "  $AAB_PATH"

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.VERSION_NAME }}
          APK: ${{ steps.paths.outputs.APK_PATH }}
          AAB: ${{ steps.paths.outputs.AAB_PATH }}
        run: |
          # gh creates the git tag at this commit and publishes (never a draft).
          # Re-runs on the same version refresh the assets instead of failing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$AAB" --clobber
            gh release edit "$TAG" --draft=false --latest
          else
            gh release create "$TAG" "$APK" "$AAB" \
              --target "$GITHUB_SHA" \
              --title "FuelLog $TAG" \
              --generate-notes --latest \
              --notes "Download \`app-release.apk\` to install (Android 8.0+, minSdk 26). \`app-release.aab\` is for Play Console."
          fi
